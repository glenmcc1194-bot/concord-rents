<style>
  :root{--ink:#12243f;--ink-2:#182f4f;--amber:#274268;--amber-2:#1d3454;--amber-ink:#ffffff;--paper:#f5f6f8;--card:#fff;--text:#14243f;--muted:#5b6b82;--line:#e4e7ec;--line-d:rgba(255,255,255,.12);--ring:rgba(39,66,104,.35);--shadow:0 1px 2px rgba(18,36,63,.06),0 8px 24px rgba(18,36,63,.08);--shadow-lg:0 24px 60px rgba(18,36,63,.28);--maxw:1140px}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Oswald','Inter',sans-serif;font-weight:700;line-height:1.1;letter-spacing:.01em;text-transform:uppercase;margin:0}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  .marker{color:#fff;background:#0a1220;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.02em .22em;border-radius:2px}
  .marker-light{color:#12243f;background:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.02em .22em;border-radius:2px}
  .btn{display:inline-flex;align-items:center;gap:.55em;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:.9rem;padding:.8em 1.3em;border-radius:0;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease,color .15s ease;white-space:nowrap}
  .btn:hover{transform:translateY(-2px)}
  .btn-amber{background:linear-gradient(180deg,var(--amber),var(--amber-2));color:var(--amber-ink);border-color:rgba(255,255,255,.16)}
  .btn-outline{background:#fff;border-color:var(--line);color:var(--text)}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
  .icon{width:1.05em;height:1.05em;fill:currentColor;flex:none}

  header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line-d)}
  header .wrap{display:flex;align-items:center;gap:16px;min-height:66px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .b{width:34px;height:34px;background:linear-gradient(180deg,var(--amber),var(--amber-2));border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
  .brand .b svg{width:23px;height:23px;display:block;fill:#fff}
  .brand b{font-family:'Oswald';font-size:1.05rem;letter-spacing:.02em;line-height:1}
  .brand span{display:block;font-size:.58rem;letter-spacing:.22em;color:#aab7c8;text-transform:uppercase;font-weight:700;margin-top:2px}
  header .sp{margin-left:auto;display:flex;gap:10px;align-items:center}

  .crumb{font-size:.82rem;color:var(--muted);padding:16px 0 0}
  .crumb a:hover{color:var(--text)}
  .crumb .sep{opacity:.5;margin:0 7px}

  .top{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;padding:20px 0 8px;align-items:start}
  .gallery .main{aspect-ratio:16/11;background:#e9edf1 center/cover no-repeat;border:1px solid var(--line);cursor:zoom-in}
  .gallery .thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .gallery .thumbs .t{width:74px;height:56px;background:#e9edf1 center/cover no-repeat;border:1px solid var(--line);cursor:pointer;opacity:.75;transition:opacity .15s,border-color .15s}
  .gallery .thumbs .t.active,.gallery .thumbs .t:hover{opacity:1;border-color:var(--amber)}

  .sum .cat{font-family:'Oswald';text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--amber-2);font-weight:600}
  .sum h1{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:8px 0 4px}
  .sum .brandline{color:var(--muted);font-weight:600;margin-bottom:14px}
  .status{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);color:#1c7c4a;background:#eef8f2;margin-bottom:14px}
  .status.out{color:#b23b3b;background:#fdeeee;border-color:#f2c9c9}
  .status .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .rates{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:0;overflow:hidden;margin:6px 0 18px}
  .rates .r{flex:1;min-width:90px;padding:12px 14px;text-align:center;border-right:1px solid var(--line)}
  .rates .r:last-child{border-right:0}
  .rates .r b{display:block;font-family:'Oswald';font-size:1.25rem;color:var(--text);line-height:1}
  .rates .r span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .rates.call{padding:12px 14px;display:block;text-align:center;color:var(--amber-2);font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .hi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 0}
  .hi .c{border:1px solid var(--line);background:#fff;padding:12px 14px}
  .hi .c .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:'Oswald'}
  .hi .c .v{font-family:'Oswald';font-size:1.15rem;color:var(--text);margin-top:2px}

  section.block{padding:26px 0}
  .block h2{font-size:1.35rem;margin-bottom:6px}
  .block .rule{height:3px;width:52px;background:var(--amber);margin:0 0 18px}
  .overview{max-width:75ch;color:#2a3a52}

  .sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .sheet .grp{border:1px solid var(--line);background:#fff;border-radius:0}
  .sheet .grp h3{font-size:.82rem;letter-spacing:.1em;background:var(--ink);color:#fff;padding:10px 14px}
  .sheet .grp table{width:100%;border-collapse:collapse}
  .sheet .grp td{padding:9px 14px;border-top:1px solid var(--line);font-size:.92rem;vertical-align:top}
  .sheet .grp tr:first-child td{border-top:0}
  .sheet .grp td.k{color:var(--muted);width:52%}
  .sheet .grp td.v{color:var(--text);font-weight:600}
  .note{font-size:.82rem;color:var(--muted);margin-top:16px;max-width:80ch}
  .note.src{opacity:.8}

  .callout{background:linear-gradient(180deg,var(--ink),#0c1a30);color:#fff;border-radius:0;padding:28px;text-align:center;margin:14px 0 0}
  .callout h2{font-size:1.5rem;margin-bottom:8px}
  .callout p{color:#c9d6e6;margin:0 0 16px}
  .callout .cta{justify-content:center}

  footer{background:#0c1a30;color:#9aa5b2;padding:34px 0;border-top:1px solid var(--line-d);margin-top:30px;font-size:.9rem}
  footer a{color:#dbe4f0}

  .empty{padding:80px 22px;text-align:center;color:var(--muted)}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(9,16,30,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:4vh 3vw}
  .lb.show{display:flex}
  .lb img{max-width:92vw;max-height:86vh;object-fit:contain}
  .lb .x,.lb .nav{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:46px;height:46px;font-size:22px;cursor:pointer;display:grid;place-items:center}
  .lb .x{top:18px;right:18px}
  .lb .nav.prev{left:14px;top:50%;transform:translateY(-50%)}
  .lb .nav.next{right:14px;top:50%;transform:translateY(-50%)}
  .lb .count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#cfd6df;font-size:.85rem}

  @media(max-width:820px){ .top{grid-template-columns:1fr;gap:20px} .sheet{grid-template-columns:1fr} .brand span{display:none} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

</defs></svg>

<header>
  <div class="wrap">
    <a class="brand" href="/"><span class="b"><svg viewBox="37 113 316 285" aria-hidden="true"><path d="M116 116 37 250 38 255 41 258 53 280 64 297 85 335 99 357 99 359 108 372 116 387 276 387 339 278 249 278 245 285 233 298 220 306 207 310 182 309 173 306 162 300 151 290 146 283 140 271 137 256 138 239 140 235 140 231 146 219 160 204 173 196 188 192 207 192 215 194 228 200 242 212 249 223 339 223 338 220 316 185 310 173 276 116Z"/></svg></span><span><b>CONCORD RENTS</b><span>Heavy Equipment Rental</span></span></a>
    <div class="sp">
      <a class="btn btn-ghost" href="/equipment/">All Equipment</a>
      <a class="btn btn-amber" href="tel:12486874515"><svg class="icon"><use href="#i-phone"/></svg> 248-687-4515</a>
    </div>

</header>

<main class="wrap" id="main">
  <div class="crumb"><a href="/">Home</a><span class="sep">/</span><a href="/equipment/">Equipment</a><span class="sep">/</span><span id="crumbCat">Details</span></div>
  <div id="content"><div class="empty">Loading equipment details…</div></div>
</main>

<footer><div class="wrap">© <span id="yr"></span> Concord Rents · Madison Heights, MI · <a href="tel:12486874515">248-687-4515</a> · <a href="/equipment/">All Equipment</a> · <a href="/">Home</a></div></footer>

<div class="lb" id="lb"><button class="x" aria-label="Close" onclick="lbClose()">✕</button><button class="nav prev" aria-label="Previous" onclick="lbStep(-1)">‹</button><img id="lbImg" alt="" /><button class="nav next" aria-label="Next" onclick="lbStep(1)">›</button><div class="count" id="lbCount"></div></div>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
var SMS_NUMBER='+12486874515';
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function slugFromUrl(){
  var q=new URLSearchParams(location.search).get('slug'); if(q) return q;
  var parts=location.pathname.split('/').filter(Boolean); // ['equipment','<slug>']
  var last=parts[parts.length-1]||'';
  if(last==='item.html'||last==='equipment') return '';
  return decodeURIComponent(last);
}
var lbImgs=[],lbIdx=0;
function lbOpen(imgs,i){lbImgs=imgs||[];if(!lbImgs.length)return;lbIdx=i||0;lbRender();document.getElementById('lb').classList.add('show');}
function lbClose(){document.getElementById('lb').classList.remove('show');}
function lbStep(d){if(!lbImgs.length)return;lbIdx=(lbIdx+d+lbImgs.length)%lbImgs.length;lbRender();}
function lbRender(){document.getElementById('lbImg').src=lbImgs[lbIdx];document.getElementById('lbCount').textContent=(lbIdx+1)+' / '+lbImgs.length;}
document.addEventListener('keydown',function(e){if(!document.getElementById('lb').classList.contains('show'))return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbStep(-1);if(e.key==='ArrowRight')lbStep(1);});

function rows(rws){return (rws||[]).map(function(r){return '<tr><td class="k">'+esc(r.k)+'</td><td class="v">'+esc(r.v)+'</td></tr>';}).join('');}

function render(item, ds){
  var cat=item.category||'Equipment';
  document.getElementById('crumbCat').textContent=cat;
  document.title=item.name+' | Concord Rents';
  var md=document.getElementById('metaDesc'); if(md) md.setAttribute('content',(item.shortDesc||item.name)+' — heavy equipment rental from Concord Rents, Madison Heights MI.');

  var imgs=(Array.isArray(item.gallery)&&item.gallery.length)?item.gallery:(item.image?[item.image]:[]);
  var cover=item.image||imgs[0]||'';
  var out=item.status==='unavailable';
  var r=item.rates||{};
  var rateBits=[];
  if(r.day) rateBits.push('<div class="r"><b>'+esc(r.day)+'</b><span>Day</span></div>');
  if(r.week) rateBits.push('<div class="r"><b>'+esc(r.week)+'</b><span>Week</span></div>');
  if(r.month) rateBits.push('<div class="r"><b>'+esc(r.month)+'</b><span>Month</span></div>');
  var ratesHtml = rateBits.length ? '<div class="rates">'+rateBits.join('')+'</div>' : '<div class="rates call">Call for pricing</div>';

  var smsBody=encodeURIComponent("Hi Concord Rents, I'd like to rent/check availability on the "+item.name+".");
  var cta='<div class="cta">'+
    '<a class="btn btn-amber" href="sms:'+SMS_NUMBER+'?body='+smsBody+'"><svg class="icon"><use href="#i-chat"/></svg> Text About This</a>'+
    '<a class="btn btn-outline" href="tel:12486874515"><svg class="icon"><use href="#i-phone"/></svg> Call to Reserve</a>'+
    '</div>';

  // highlights: datasheet highlights, else the listing's own specs
  var hi = (ds&&ds.highlights&&ds.highlights.length) ? ds.highlights : (item.specs||[]);
  var hiHtml = hi.length ? '<div class="hi">'+hi.slice(0,6).map(function(s){return '<div class="c"><div class="k">'+esc(s.k||'Spec')+'</div><div class="v">'+esc(s.v)+'</div></div>';}).join('')+'</div>' : '';

  var thumbs = imgs.length>1 ? '<div class="thumbs">'+imgs.map(function(u,i){return '<div class="t'+(i===0?' active':'')+'" data-i="'+i+'" style="background-image:url(\''+esc(u)+'\')"></div>';}).join('')+'</div>' : '';

  var top = '<div class="top">'+
    '<div class="gallery">'+
      '<div class="main" id="mainImg" style="background-image:url(\''+esc(cover)+'\')"></div>'+thumbs+
    '</div>'+
    '<div class="sum">'+
      '<div class="cat">'+esc(cat)+'</div>'+
      '<h1>'+esc(item.name)+'</h1>'+
      (item.brand?'<div class="brandline">'+esc(item.brand)+'</div>':'')+
      '<div class="status'+(out?' out':'')+'"><span class="dot"></span>'+(out?'Currently Out':'Available to Rent')+'</div>'+
      ratesHtml+
      cta+
      hiHtml+
    '</div>'+
  '</div>';

  // overview
  var ov = '';
  var ovText = (ds&&ds.overview) || item.description || item.shortDesc || '';
  if(ovText){ ov = '<section class="block"><h2>Overview</h2><div class="rule"></div><p class="overview">'+esc(ovText).replace(/\n+/g,'<br>')+'</p>'+
    (ds&&ds.attachmentsNote?'<p class="note"><strong>Attachments:</strong> '+esc(ds.attachmentsNote)+'</p>':'')+
    (ds&&ds.coversNote?'<p class="note"><strong>This listing covers:</strong> '+esc(ds.coversNote)+'</p>':'')+
    '</section>'; }

  // datasheet
  var sheet='';
  if(ds&&ds.sections&&ds.sections.length){
    sheet = '<section class="block"><h2>Specifications</h2><div class="rule"></div>'+
      '<div class="sheet">'+ds.sections.map(function(g){return '<div class="grp"><h3>'+esc(g.group)+'</h3><table>'+rows(g.rows)+'</table></div>';}).join('')+'</div>'+
      (ds.configNote?'<p class="note">'+esc(ds.configNote)+'</p>':'')+
      (ds.source?'<p class="note src">Spec source: '+esc(ds.source)+'. Hours, mileage and unit numbers shown as “-” until confirmed for this unit.</p>':'')+
    '</section>';
  } else {
    sheet = '<section class="block"><h2>Specifications</h2><div class="rule"></div>'+
      '<p class="overview">A full spec sheet for this machine is being finalized. For exact capacities, dimensions and availability, text or call us and we’ll send the details right over.</p></section>';
  }

  var callout = '<section class="block"><div class="callout"><h2>Need <span class="marker-light">this machine</span> on site?</h2><p>Tell us your dates and job location — we deliver across Michigan.</p>'+cta.replace('class="cta"','class="cta"')+'</div></section>';

  document.getElementById('content').innerHTML = top + ov + sheet + callout;

  // gallery interactions
  var main=document.getElementById('mainImg');
  if(main) main.addEventListener('click',function(){lbOpen(imgs,0);});
  Array.prototype.forEach.call(document.querySelectorAll('.thumbs .t'),function(t){
    t.addEventListener('click',function(){
      var i=+t.getAttribute('data-i');
      main.style.backgroundImage="url('"+imgs[i]+"')";
      document.querySelectorAll('.thumbs .t').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
    });
    t.addEventListener('dblclick',function(){lbOpen(imgs,+t.getAttribute('data-i'));});
  });
}

(async function(){
  var slug=slugFromUrl();
  if(!slug){ document.getElementById('content').innerHTML='<div class="empty">No equipment selected. <a href="/equipment/" style="color:var(--amber-2);font-weight:600">Browse all equipment ›</a></div>'; return; }
  try{
    var results=await Promise.all([
      fetch('/api/equipment').then(function(r){return r.json();}),
      fetch('/data/datasheets.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}),
      fetch('/api/settings').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};})
    ]);
    var list=(results[0]&&results[0].equipment)||results[0]||[];
    var sheets=results[1]||{};
    if(results[2]&&results[2].smsNumber) SMS_NUMBER=results[2].smsNumber;
    var item=list.filter(function(e){return e.slug===slug;})[0] || list.filter(function(e){return (e.id===slug);})[0];
    if(!item){ document.getElementById('content').innerHTML='<div class="empty">We couldn’t find that machine. <a href="/equipment/" style="color:var(--amber-2);font-weight:600">Browse all equipment ›</a></div>'; return; }
    // datasheet may be keyed by slug or listing id; DB-set datasheet on the item wins
    var ds = item.datasheet || sheets[item.slug] || sheets[item.id] || null;
    render(item, ds);
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">Couldn’t load details. Call <a href="tel:12486874515" style="color:var(--amber-2);font-weight:600">248-687-4515</a>.</div>';
  }
})();
</script>
</body>
